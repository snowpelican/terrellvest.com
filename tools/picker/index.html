<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Picker</title>
<link rel="icon" type="image/png" href="/assets/images/site-wide/favicon-logo.png">
<link rel="stylesheet" href="picker.css">
</head>
<body>
<header class="bar">
  <strong class="brand">Photo picker</strong>
  <span id="root" class="muted mono" title="The photo folder. The picker only reads it."></span>
  <span class="grow"></span>
  <span id="saveState" class="muted"></span>
  <a class="button" href="/photography/" target="_blank" rel="noopener">Open gallery</a>
  <button id="update" class="primary" title="Make the gallery images and photos.js from the chosen photos">Update gallery</button>
</header>

<div class="app">
  <aside class="tree" aria-label="Folders">
    <ul id="tree" role="tree"></ul>
  </aside>

  <main class="grid-wrap">
    <p id="gridNote" class="muted"></p>
    <ul class="grid" id="grid"></ul>
  </main>

  <aside class="side" aria-label="Collections">
    <h2>Collections</h2>
    <p class="muted small">Click a photo to add it to the open collection, or to take it out. Drag to change the order.</p>
    <div id="collections"></div>
    <button id="addCollection">+ New collection</button>
  </aside>
</div>

<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <div class="viewer-bar">
    <button id="viewerPrev" class="icon" title="Previous photo (←)" aria-label="Previous photo">‹</button>
    <span id="viewerName"></span>
    <button id="viewerPick" title="Add or take out (Space)"></button>
    <button id="viewerNext" class="icon" title="Next photo (→)" aria-label="Next photo">›</button>
    <button id="viewerClose" class="icon" title="Close (Esc)" aria-label="Close">×</button>
  </div>
</div>

<dialog id="updateLog">
  <h2>Update gallery</h2>
  <pre id="updateText"></pre>
  <form method="dialog"><button id="updateClose">Close</button></form>
</dialog>

<script src="picker.js"></script>
</body>
</html>
