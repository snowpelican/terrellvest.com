/* Arriving from the arrow on the home page: the home page slides up and away, and this page slides up in under it.
   A cross-page view transition; browsers without them just open the page. */
@media (prefers-reduced-motion:no-preference){
  @view-transition{navigation:auto}
  html.arrive::view-transition-old(root){animation:vt-out .75s cubic-bezier(.3,.75,.2,1) both}
  html.arrive::view-transition-new(root){animation:vt-in .75s cubic-bezier(.3,.75,.2,1) both}
  @keyframes vt-out{to{transform:translateY(-100%)}}
  @keyframes vt-in{from{transform:translateY(100%)}}
}
</style>
<script>
// The slide plays only when the home page's arrow sent the visitor here (it leaves a note in sessionStorage); any other page change is instant
addEventListener('pagereveal', e => {
  if (!e.viewTransition) return;
  let sent = false; try { sent = sessionStorage.getItem('arrive') === 'rise'; sessionStorage.removeItem('arrive'); } catch (err) {}
  if (!sent) return e.viewTransition.skipTransition();
  document.documentElement.classList.add('arrive');
  e.viewTransition.finished.finally(() => document.documentElement.classList.remove('arrive'));
});
addEventListener('pageswap', e => e.viewTransition && e.viewTransition.skipTransition());
</script>

<meta name="theme-color" content="#ffffff" id="themeColor">
<meta name="color-scheme" content="light dark" id="colorScheme">
<script>
// Theme: the device's light/dark setting (followed live if it changes), unless the visitor picked one with the toggle during this visit.
// The pick lasts for the tab's session only, so every new visit starts from the device again. It survives a reload (the iOS toggle reloads).
// Runs before the page paints, so there's no flash of the wrong theme.
(() => {
  const q = matchMedia('(prefers-color-scheme: dark)'), root = document.documentElement;
  let saved = null; try { localStorage.removeItem('theme'); saved = sessionStorage.getItem('theme'); } catch (e) {}
  // Safari's own bars follow three things: the page's colour scheme (this meta, plus color-scheme in the CSS), the page background,
  // and theme-color on older iOS. Pin the meta to the site's theme, not "light dark", or Safari keeps following the phone's setting.
  // Swapping the theme-color tag for a fresh one, rather than editing it, nudges Safari to re-read its colours without a reload.
  const apply = t => {
    root.dataset.theme = t;
    document.getElementById('colorScheme').content = t;
    const old = document.getElementById('themeColor'), tc = old.cloneNode(); tc.content = t === 'dark' ? '#111213' : '#ffffff'; old.replaceWith(tc);
    window.onTheme && window.onTheme(t);
  };
  apply(saved || (q.matches ? 'dark' : 'light'));
  q.addEventListener('change', () => { if (!saved) apply(q.matches ? 'dark' : 'light'); });
  // Picking the same theme as the device forgets the choice, so the page goes back to following the device
  window.setTheme = t => { saved = t === (q.matches ? 'dark' : 'light') ? null : t; try { saved ? sessionStorage.setItem('theme', saved) : sessionStorage.removeItem('theme'); } catch (e) {} apply(t); };
})();
</script>
